name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore PanelExtractor.sln

      - name: Verify remote transports remain read-only
        shell: pwsh
        run: |
          $sourceFiles = Get-ChildItem -Path . -Filter *.cs -Recurse |
            Where-Object FullName -NotMatch '\\(bin|obj|PanelExtractor.Tests)\\'
          $forbidden = '\.(UploadFile|UploadFileAsync|UploadStream|UploadBytes|UploadDirectory|DeleteFile|DeleteDirectory|RenameFile|MoveFile|MoveDirectory|OpenWrite|OpenAppend|SetAttributes|SetFilePermissions|ChangePermissions|Execute)\s*\('
          $matches = $sourceFiles | Select-String -Pattern $forbidden
          if ($matches) {
            $matches | ForEach-Object { Write-Error $_.Line }
            exit 1
          }

      - name: Build
        run: dotnet build PanelExtractor.sln --configuration Release --no-restore -warnaserror

      - name: Test
        run: dotnet test PanelExtractor.sln --configuration Release --no-build --filter "TestCategory!=Integration" --logger trx
